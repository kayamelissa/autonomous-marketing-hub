name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: bash scripts/setup_skills.sh
      - run: python -m pytest -q
      - name: Offline demo (no keys, recorded fixtures)
        run: python -m hub.run_all --brand boyer-law-firm --fixtures tests/fixtures/demo --no-send
