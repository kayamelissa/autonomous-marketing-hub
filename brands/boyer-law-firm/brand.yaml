name: Boyer Hukuk Bürosu
aliases: [Boyer Law Firm, Boyer Law Firm P.L., Boyer Hukuk, Boyer Law, Francis Boyer, Francis M. Boyer, floridaturkavukat]
description: >
  Boyer Law Firm, P.L. (Boyer Hukuk Bürosu): 2008'den beri Jacksonville merkezli, Florida
  (Jacksonville, Miami, Orlando/Altamonte Springs, Tampa, Boca Raton), New York ve Mobile AL
  ofisleriyle Türkçe iletişim desteği veren ABD hukuk bürosu. Alanlar: göçmenlik (aile, EB-1/2/3,
  L-1, H-1B, TN, E-1, E-2, EB-5, vatandaşlık), uluslararası hukuk (uluslararası boşanma ve velayet,
  Lahey çocuk kaçırma, yabancı mahkeme kararının tanınması), Florida aile hukuku, ticari davalar,
  şirketler hukuku, miras ve tereke. Kurucu avukat Francis M. Boyer, Florida Barosu tarafından
  Uluslararası Hukukta Board Certified'dır. İstanbul'daki nokta bir müvekkil destek ofisidir, hukuk
  ofisi değildir; büro Türk hukuku kapsamında hizmet vermez.
domain: floridaturkavukat.com
city: Jacksonville
places_query: Boyer Law Firm P.L. Jacksonville
language: tr
country: US
timezone: Europe/Istanbul   # the marketing team's morning
voice: >
  Sakin, anlaşılır, güven veren Türkçe. Hukuki terimi önce sade dille açıkla. Süreci adım adım
  anlat, abartma. "Siz" dili. Kısa paragraflar.
offers:
  - E-2 yatırımcı vizesi ve Florida'da şirket kuruluşu
  - Green Card (aile, evlilik, EB-1/EB-2/EB-3) ve vatandaşlık
  - Uluslararası boşanma, velayet, Lahey çocuk kaçırma
  - Türkiye mahkeme kararlarının Florida/New York'ta tanınması
  - Florida ticari davaları, sözleşme ve ortaklık uyuşmazlıkları
  - Miras, vasiyet, tereke (probate) ve uluslararası miras planlaması

compliance:
  - Florida Barosu reklam kuralları (Rule 4-7) geçerli. Sonuç vaadi ya da garanti yok ("kazanırız", "kesin onay", "48 saatte green card" gibi).
  - '"Uzman" / "specialist" / "expert" kelimesini kullanma. İstisna: Francis M. Boyer için "Florida Barosu tarafından Uluslararası Hukukta Board Certified" ifadesi.'
  - Geçmiş sonuç ya da müvekkil yorumu kullanılırsa doğrulanabilir olmalı ve "geçmiş sonuçlar gelecekteki sonuçları garanti etmez" notu eklenmeli.
  - Her reklam, sosyal medya ve açılış sayfası taslağına "Avukat Reklamı / Attorney Advertising" ibaresi eklenmeli.
  - Kişiye özel hukuki tavsiye gibi okunabilecek içerik yazma; danışma görüşmesine davet et.
  - İstanbul noktasını hukuk ofisi gibi sunma; Türk hukuku hizmeti ima etme.
  - Rakip büroların adını reklam metninde kullanma.
  - '"En iyi", "lider", "bir numaralı", "tek adres", "yetenekli", "kanıtlanmış başarı" gibi doğrulanamaz üstünlük ve nitelik iddiaları kullanma.'
  - Board Certified unvanı yalnızca Francis M. Boyer'e aittir; "sertifikamız" ya da "sertifikalı büro" diyerek büroya mal etme. Türkçede "kurul onaylı" yazma.
  - 'Hukuki terim karşılıkları: trust = "trust" (fon ya da vakıf değil); civil litigation = "hukuk davası" (medeni hukuk değil); personal representative = "tereke temsilcisi"; breach of fiduciary duty = "sadakat ve özen yükümlülüğünün ihlali"; foreign money judgment = "para alacağına ilişkin yabancı mahkeme kararı"; E-2 Treaty Investor = "E-2 yatırımcı vizesi".'
  - Türkçe karakterleri (ı, İ, ş, ğ, ü, ö, ç) eksiksiz kullan; büro için "firma" değil "büro" de.

